# SonarCloud project identity
sonar.organization = nick2bad4u
sonar.projectKey = Nick2bad4u_Gardening
sonar.projectName = Gardening
sonar.host.url = https://sonarcloud.io

# The Apps Script server is the repository's LCOV-mapped application code. The
# browser client remains inline in Index.html and is covered by DOM tests,
# HTMLHint, and browser QA rather than a fabricated JavaScript coverage map.
sonar.sources = scripts/google-sheets/plant-tracker.gs
sonar.tests = test/google-sheets
sonar.sourceEncoding = UTF-8
sonar.scm.provider = git

# Analyze Apps Script .gs files as JavaScript rather than Gosu.
sonar.javascript.file.suffixes = .js,.jsx,.mjs,.cjs,.gs
sonar.lang.patterns.gosu = **/*.gsx,**/*.gsp
sonar.test.inclusions = test/google-sheets/**/*.test.mjs
sonar.cpd.exclusions = test/**

# Vitest maps its V8 report directly to plant-tracker.gs. Index.html is tested
# in a DOM harness but cannot be represented honestly as a JavaScript LCOV file.
sonar.javascript.lcov.reportPaths = coverage/lcov.info
sonar.coverage.exclusions = test/**

sonar.javascript.detectBundles = true
sonar.qualitygate.wait = true
