# SonarCloud project identity
sonar.organization = nick2bad4u
sonar.projectKey = Nick2bad4u_Gardening
sonar.projectName = Gardening
sonar.host.url = https://sonarcloud.io

# The Apps Script logger is the repository's tested application code. The
# browser client remains inline in Index.html because Apps Script deploys this
# page as one self-contained file.
sonar.sources = scripts/google-sheets
sonar.tests = test/google-sheets
sonar.sourceEncoding = UTF-8
sonar.scm.provider = git

# Analyze Apps Script .gs files as JavaScript and exclude documentation and the
# Apps Script manifest from source metrics.
sonar.javascript.file.suffixes = .js,.jsx,.mjs,.cjs,.gs
sonar.lang.patterns.gosu = **/*.gsx,**/*.gsp
sonar.exclusions = \
    scripts/google-sheets/README.md,scripts/google-sheets/appsscript.json
sonar.test.inclusions = test/google-sheets/**/*.test.mjs
sonar.cpd.exclusions = test/**,scripts/google-sheets/Index.html

# Vitest maps its V8 report directly to plant-tracker.gs. Index.html is tested
# in a DOM harness but cannot be represented honestly as a JavaScript LCOV file.
sonar.javascript.lcov.reportPaths = coverage/lcov.info
sonar.coverage.exclusions = test/**,scripts/google-sheets/Index.html

sonar.javascript.detectBundles = true
sonar.qualitygate.wait = true
