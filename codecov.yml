# yaml-language-server: $schema=https://www.schemastore.org/codecov.json

codecov:
    branch: "main"
    max_report_age: "24h"
    require_ci_to_pass: true
    slug: "Nick2bad4u/Gardening"

comment:
    behavior: "default"
    layout: "header, diff, components, files, footer"
    require_base: false
    require_changes: false
    require_head: true

component_management:
    default_rules:
        statuses:
            - type: "project"
              target: "auto"
              threshold: "1%"
    individual_components:
        - component_id: "apps-script-server"
          name: "Apps Script server"
          paths:
              - "scripts/google-sheets/plant-tracker.gs"

coverage:
    precision: 2
    range: "10...60"
    round: "down"
    status:
        patch:
            default:
                target: "auto"
                threshold: "1%"
        project:
            default:
                target: "auto"
                threshold: "1%"

flags:
    apps-script-server:
        carryforward: false
        paths:
            - "scripts/google-sheets/plant-tracker.gs"

ignore:
    - "assets/**"
    - "coverage/**"
    - "docs/**"
    - "test/**"
    - "scripts/google-sheets/Index.html"
    - "scripts/google-sheets/appsscript.json"
    - "scripts/google-sheets/README.md"
    - "**/*.d.ts"
    - "**/*.test.*"
    - "**/*.spec.*"
