  <title id="tiny-mixed-succulent-planter-title">Tiny mixed succulent planter plant portrait</title>
  <desc id="tiny-mixed-succulent-planter-description">Two large pale rosettes and a smaller open rosette surround broad red-edged green paddles, copper-orange shoots, and a green-and-burgundy shoot in a striped terracotta planter.</desc>
