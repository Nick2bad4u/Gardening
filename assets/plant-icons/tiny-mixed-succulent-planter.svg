  <title id="tiny-mixed-succulent-planter-title">Tiny mixed succulent planter plant portrait</title>
  <desc id="tiny-mixed-succulent-planter-description">Two pale rosettes, broad red-orange paddles, copper-orange shoots, and low purple foliage share a shallow rounded green-glazed bowl with multicolored mineral grit, following owner photographs of #6 / P30.</desc>
