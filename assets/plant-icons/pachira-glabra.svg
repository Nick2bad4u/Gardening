      </linearGradient>
      <linearGradient id="money-leaf" x1="0" y1="0" x2="0.85" y2="1">
          <stop offset="0" stop-color="#a6c879" />
          <stop offset="0.5" stop-color="#5a9b58" />
          <stop offset="1" stop-color="#2e6948" />
      </linearGradient>
      <linearGradient id="money-trunk" x1="0" y1="0" x2="0.85" y2="1">
