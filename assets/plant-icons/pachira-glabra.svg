<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="pachira-glabra-title pachira-glabra-description" data-plant-slug="pachira-glabra" focusable="false">
  <title id="pachira-glabra-title">Money tree plant portrait</title>
  <desc id="pachira-glabra-description">A slim tapering trunk with connected stalks and fans of long pointed green palmate leaflets in a blue planter.</desc>
