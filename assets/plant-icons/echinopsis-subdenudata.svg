  <desc id="echinopsis-subdenudata-description">Photo-informed schematic of Domino as a low bright-green rounded cactus with broad ribs, conspicuous soft white areole tufts and very short fine spines, in mixed mineral top dressing and a sage-green faceted pot.</desc>
