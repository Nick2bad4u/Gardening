  <title id="gymnocalycium-mihanovichii-black-widow-title">Black Widow chin cactus plant portrait</title>
  <desc id="gymnocalycium-mihanovichii-black-widow-description">Photo-informed schematic of Black Widow with a low angular burgundy-red ribbed body, pointed chin-like ridges and fine pale spreading spines, in mixed mineral top dressing and a teal-blue faceted pot. This is P27, distinct from P01 in its yellow pot.</desc>
  <desc id="nov01-a-p27-description">
      Photo-informed schematic of Black Widow with a low angular burgundy-red ribbed body,
      pointed chin-like ridges and fine pale spreading spines, in mixed mineral top
      dressing and a teal-blue faceted pot. This is P27, distinct from P01 in its yellow
      pot.
  </desc>
