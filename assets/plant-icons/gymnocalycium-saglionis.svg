  <title id="gymnocalycium-saglionis-title">Giant chin cactus plant portrait</title>
  <desc id="gymnocalycium-saglionis-description">Photo-informed schematic of Giant chin as a broad muted-green globe with large rounded chin-like ribs, pale areoles and long dark spreading spines, in mixed mineral top dressing and a sage-green faceted pot.</desc>
  <desc id="nov01-a-p07-description">
      Photo-informed schematic of Giant chin as a broad muted-green globe with large
      rounded chin-like ribs, pale areoles and long dark spreading spines, in mixed
      mineral top dressing and a sage-green faceted pot.
