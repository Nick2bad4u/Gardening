  <title id="pilosocereus-pachycladus-variegated-title">Variegated blue torch cactus plant portrait</title>
  <desc id="pilosocereus-pachycladus-variegated-description">An isolated schematic view of P19 / #1's probable variegated blue torch: a tall ribbed blue-green column with irregular cream streaks and fine golden spines, using the same broad dark etched shared-planter framing, not a separate pot.</desc>
