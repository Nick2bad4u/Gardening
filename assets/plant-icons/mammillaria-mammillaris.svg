  <title id="mammillaria-mammillaris-title">Woolly nipple cactus plant portrait</title>
  <desc id="mammillaria-mammillaris-description">A low green cactus with distinct rounded tubercles, small white woolly patches, pale radial spines, and bright red club-shaped fruits, above mineral gravel in a yellow faceted pot.</desc>
