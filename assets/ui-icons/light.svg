<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-light-title" aria-describedby="ui-light-description" data-ui-icon="light" focusable="false">
  <title id="ui-light-title">Light</title>
<desc id="ui-light-description">
    A golden sun with evenly spaced rays illuminates a small green leaf.
</desc>
<defs>
    <path
        id="ui-light-ray"
        d="M30 9v-5"
        fill="none"
        stroke="#cb8852"
        stroke-width="2.6"
    />
    <radialGradient id="ui-light-gold-round" cx="32%" cy="24%" r="82%">
        <stop offset="0" stop-color="#ffe7a1" />
        <stop offset="0.52" stop-color="#ebc65d" />
        <stop offset="1" stop-color="#c29136" />
    </radialGradient>
    <linearGradient id="ui-light-leaf" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#a8dea1" />
        <stop offset="0.52" stop-color="#68b780" />
        <stop offset="1" stop-color="#347b62" />
    </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
    <use href="#ui-light-ray" transform="rotate(0 30 29)" />
    <use href="#ui-light-ray" transform="rotate(45 30 29)" />
    <use href="#ui-light-ray" transform="rotate(90 30 29)" />
    <use href="#ui-light-ray" transform="rotate(135 30 29)" />
    <use href="#ui-light-ray" transform="rotate(180 30 29)" />
    <use href="#ui-light-ray" transform="rotate(225 30 29)" />
    <use href="#ui-light-ray" transform="rotate(270 30 29)" />
    <use href="#ui-light-ray" transform="rotate(315 30 29)" />
    <circle
        cx="30"
        cy="29"
        r="13"
        fill="url(#ui-light-gold-round)"
        stroke="#825736"
        stroke-width="2"
    />
    <path
        d="M22 26a8 8 0 0 1 8 -8"
        fill="none"
        stroke="#fff4d8"
        stroke-width="1.8"
        opacity="0.72"
    />
    <path
        d="M40 56c-1-11 5-18 16-19 1 11-5 18-16 19Z"
        fill="url(#ui-light-leaf)"
        stroke="#2c5146"
        stroke-width="1.8"
    />
    <path
        d="m43 52 9-11"
