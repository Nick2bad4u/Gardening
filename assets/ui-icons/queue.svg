<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-queue-title" aria-describedby="ui-queue-description" data-ui-icon="queue" focusable="false">
  <title id="ui-queue-title">Queue</title>
