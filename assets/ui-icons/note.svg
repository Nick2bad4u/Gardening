<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-note-title" aria-describedby="ui-note-description" data-ui-icon="note" focusable="false">
  <title id="ui-note-title">Note</title>
<desc id="ui-note-description">
