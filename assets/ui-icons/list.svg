<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-list-title" aria-describedby="ui-list-description" data-ui-icon="list" focusable="false">
  <title id="ui-list-title">List</title>
<desc id="ui-list-description">
