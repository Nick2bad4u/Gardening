<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-calendar-title" aria-describedby="ui-calendar-description" data-ui-icon="calendar" focusable="false">
  <title id="ui-calendar-title">Calendar</title>
<desc id="ui-calendar-description">
