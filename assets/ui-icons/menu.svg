<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-menu-title" aria-describedby="ui-menu-description" data-ui-icon="menu" focusable="false">
  <title id="ui-menu-title">Menu</title>
<desc id="ui-menu-description">
    Three balanced colored menu bars inside a rounded cream tile.
</desc>
<defs>
    <linearGradient id="ui-menu-paper" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#fff7e4" />
        <stop offset="0.52" stop-color="#f1e8ce" />
        <stop offset="1" stop-color="#d6cba8" />
    </linearGradient>
    <linearGradient id="ui-menu-leaf" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#a8dea1" />
        <stop offset="0.52" stop-color="#68b780" />
        <stop offset="1" stop-color="#347b62" />
    </linearGradient>
    <linearGradient id="ui-menu-gold" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#ffe7a1" />
        <stop offset="0.52" stop-color="#ebc65d" />
        <stop offset="1" stop-color="#c29136" />
    </linearGradient>
    <linearGradient id="ui-menu-metal" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#c1dce0" />
        <stop offset="0.52" stop-color="#8db4bf" />
        <stop offset="1" stop-color="#5c8395" />
    </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
    <rect
        x="7"
        y="7"
        width="50"
        height="50"
        rx="11"
        fill="url(#ui-menu-paper)"
        stroke="#2c5146"
        stroke-width="2.3"
    />
    <rect
        x="17"
        y="17.7"
        width="30"
        height="4.6"
        rx="2.3"
        fill="url(#ui-menu-leaf)"
        stroke="none"
        stroke-width="0"
    />
    <rect
        x="17"
        y="29.7"
        width="30"
        height="4.6"
        rx="2.3"
        fill="url(#ui-menu-gold)"
        stroke="none"
        stroke-width="0"
    />
    <rect
        x="17"
        y="41.7"
        width="30"
        height="4.6"
        rx="2.3"
        fill="url(#ui-menu-metal)"
        stroke="none"
        stroke-width="0"
    />
</g>
</svg>
