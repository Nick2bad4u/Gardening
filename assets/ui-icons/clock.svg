<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-clock-title" aria-describedby="ui-clock-description" data-ui-icon="clock" focusable="false">
  <title id="ui-clock-title">Clock</title>
<desc id="ui-clock-description">
    A cream clock face with twelve clear tick marks and balanced hands.
</desc>
<defs>
    <path
        id="ui-clock-tick"
        d="M32 13v3"
        fill="none"
        stroke="#648472"
        stroke-width="1.5"
    />
    <linearGradient id="ui-clock-metal" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#c1dce0" />
        <stop offset="0.52" stop-color="#8db4bf" />
        <stop offset="1" stop-color="#5c8395" />
    </linearGradient>
    <linearGradient id="ui-clock-paper" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#fff7e4" />
        <stop offset="0.52" stop-color="#f1e8ce" />
        <stop offset="1" stop-color="#d6cba8" />
    </linearGradient>
    <linearGradient id="ui-clock-gold" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#ffe7a1" />
        <stop offset="0.52" stop-color="#ebc65d" />
        <stop offset="1" stop-color="#c29136" />
    </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
    <circle
        cx="32"
        cy="32"
        r="25"
        fill="url(#ui-clock-metal)"
        stroke="#3d606e"
        stroke-width="2.2"
    />
    <circle
        cx="32"
        cy="32"
        r="21"
        fill="url(#ui-clock-paper)"
        stroke="#2c5146"
        stroke-width="1.5"
    />
    <use href="#ui-clock-tick" transform="rotate(0 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(30 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(60 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(90 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(120 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(150 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(180 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(210 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(240 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(270 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(300 32 32)" />
    <use href="#ui-clock-tick" transform="rotate(330 32 32)" />
    <path
        d="M32 20v12l11 7"
        fill="none"
        stroke="#3d606e"
        stroke-width="3"
    />
    <circle
        cx="32"
        cy="32"
        r="3"
        fill="url(#ui-clock-gold)"
        stroke="#825736"
        stroke-width="1.2"
    />
</g>
</svg>
