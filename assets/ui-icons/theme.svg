<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-theme-title" aria-describedby="ui-theme-description" data-ui-icon="theme" focusable="false">
  <title id="ui-theme-title">Theme</title>
<desc id="ui-theme-description">
    A balanced circular day-and-night control combines a sunlit half and a
    crescent with star.
</desc>
<defs>
    <clipPath id="ui-theme-left-half" clipPathUnits="userSpaceOnUse">
        <rect
            x="6"
            y="6"
            width="26"
            height="52"
            rx="0"
            fill="#ffffff"
            stroke="none"
            stroke-width="0"
        />
    </clipPath>
    <linearGradient id="ui-theme-night" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#c2cee8" />
        <stop offset="0.52" stop-color="#8b9ec8" />
        <stop offset="1" stop-color="#576d9b" />
    </linearGradient>
    <linearGradient id="ui-theme-gold" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#ffe7a1" />
        <stop offset="0.52" stop-color="#ebc65d" />
        <stop offset="1" stop-color="#c29136" />
    </linearGradient>
    <linearGradient id="ui-theme-paper" x1="12%" y1="0%" x2="88%" y2="100%">
        <stop offset="0" stop-color="#fff7e4" />
        <stop offset="0.52" stop-color="#f1e8ce" />
        <stop offset="1" stop-color="#d6cba8" />
    </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
    <circle
        cx="32"
        cy="32"
        r="25"
        fill="url(#ui-theme-night)"
        stroke="#3d606e"
        stroke-width="2.2"
    />
    <g clip-path="url(#ui-theme-left-half)">
        <circle
            cx="32"
            cy="32"
            r="25"
            fill="url(#ui-theme-gold)"
            stroke="#825736"
            stroke-width="1.5"
        />
    </g>
    <path d="M32 7v50" fill="none" stroke="#3d606e" stroke-width="1.5" />
    <path
        d="M23 16c-13 8-13 24 0 32"
        fill="none"
        stroke="#fff4d8"
        stroke-width="3"
        opacity="0.72"
    />
    <path
        d="M45 25c-7 2-8 12-2 16 4 3 10 1 12-3-9 1-14-5-10-13Z"
        fill="url(#ui-theme-paper)"
        stroke="#657293"
        stroke-width="1"
    />
    <path
        d="M43 12.5l0.98 2.52L46.5 16l-2.52 0.98L43 19.5l-0.98 -2.52L39.5 16l2.52 -0.98Z"
        fill="url(#ui-theme-gold)"
        stroke="#825736"
        stroke-width="1.5"
    />
</g>
</svg>
