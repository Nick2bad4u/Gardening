<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-succulent-title" aria-describedby="ui-succulent-description" data-ui-icon="succulent" focusable="false">
  <title id="ui-succulent-title">Succulent</title>
<desc id="ui-succulent-description">
    Eight broad veined succulent leaves form a balanced rosette inside a
    round soil rim.
</desc>
<defs>
    <linearGradient
        id="ui-succulent-paper"
        x1="12%"
        y1="0%"
        x2="88%"
        y2="100%"
    >
        <stop offset="0" stop-color="#fff7e4" />
        <stop offset="0.52" stop-color="#f1e8ce" />
        <stop offset="1" stop-color="#d6cba8" />
    </linearGradient>
    <linearGradient
        id="ui-succulent-soil"
        x1="12%"
        y1="0%"
        x2="88%"
        y2="100%"
    >
        <stop offset="0" stop-color="#bc9c70" />
        <stop offset="0.52" stop-color="#917353" />
        <stop offset="1" stop-color="#68543e" />
    </linearGradient>
    <linearGradient
        id="ui-succulent-teal"
        x1="12%"
        y1="0%"
        x2="88%"
        y2="100%"
    >
        <stop offset="0" stop-color="#a6d8ba" />
        <stop offset="0.52" stop-color="#5aac99" />
        <stop offset="1" stop-color="#2d786e" />
    </linearGradient>
    <path
        id="ui-succulent-petal"
        d="M32 34C23 29 24 15 32 12c8 3 9 15 0 22Z"
        fill="url(#ui-succulent-teal)"
        stroke="#2c5146"
        stroke-width="1.5"
    />
    <radialGradient id="ui-succulent-leaf-round" cx="32%" cy="24%" r="82%">
        <stop offset="0" stop-color="#a8dea1" />
        <stop offset="0.52" stop-color="#68b780" />
        <stop offset="1" stop-color="#347b62" />
    </radialGradient>
    <linearGradient
        id="ui-succulent-gold"
        x1="12%"
        y1="0%"
        x2="88%"
        y2="100%"
    >
        <stop offset="0" stop-color="#ffe7a1" />
        <stop offset="0.52" stop-color="#ebc65d" />
        <stop offset="1" stop-color="#c29136" />
    </linearGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
    <circle
        cx="32"
        cy="32"
        r="25"
        fill="url(#ui-succulent-paper)"
        stroke="#825736"
        stroke-width="2.1"
    />
    <circle
        cx="32"
        cy="32"
        r="21"
        fill="url(#ui-succulent-soil)"
        stroke="#825736"
        stroke-width="1.4"
    />
    <use href="#ui-succulent-petal" transform="rotate(0 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(45 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(90 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(135 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(180 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(225 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(270 32 32)" />
    <use href="#ui-succulent-petal" transform="rotate(315 32 32)" />
    <circle
        cx="32"
        cy="32"
        r="5.6"
        fill="url(#ui-succulent-leaf-round)"
        stroke="#2c5146"
        stroke-width="1.5"
    />
    <circle
        cx="32"
        cy="32"
        r="2.2"
        fill="url(#ui-succulent-gold)"
        stroke="none"
        stroke-width="0"
    />
</g>
</svg>
