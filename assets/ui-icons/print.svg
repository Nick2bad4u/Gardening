<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-print-title" aria-describedby="ui-print-description" data-ui-icon="print" focusable="false">
  <title id="ui-print-title">Print</title>
