<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-sun-title" aria-describedby="ui-sun-description" data-ui-icon="sun" focusable="false">
  <title id="ui-sun-title">Sun</title>
<desc id="ui-sun-description">
    A round golden sun with eight balanced rays and a subtle highlight.
</desc>
<defs>
    <path
        id="ui-sun-ray"
        d="M32 11v-5"
        fill="none"
        stroke="#cb8852"
        stroke-width="2.6"
    />
    <radialGradient id="ui-sun-gold-round" cx="32%" cy="24%" r="82%">
        <stop offset="0" stop-color="#ffe7a1" />
        <stop offset="0.52" stop-color="#ebc65d" />
        <stop offset="1" stop-color="#c29136" />
    </radialGradient>
</defs>
<g stroke-linecap="round" stroke-linejoin="round">
    <use href="#ui-sun-ray" transform="rotate(0 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(45 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(90 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(135 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(180 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(225 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(270 32 32)" />
    <use href="#ui-sun-ray" transform="rotate(315 32 32)" />
    <circle
        cx="32"
        cy="32"
        r="14"
        fill="url(#ui-sun-gold-round)"
        stroke="#825736"
        stroke-width="2"
    />
    <path
        d="M23 29a9 9 0 0 1 9 -9"
        fill="none"
        stroke="#fff4d8"
        stroke-width="1.8"
        opacity="0.72"
    />
</g>
</svg>
