<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-temperature-title" aria-describedby="ui-temperature-description" data-ui-icon="temperature" focusable="false">
  <title id="ui-temperature-title">Temperature</title>
<desc id="ui-temperature-description">
