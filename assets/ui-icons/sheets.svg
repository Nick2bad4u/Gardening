<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-sheets-title" aria-describedby="ui-sheets-description" data-ui-icon="sheets" focusable="false">
  <title id="ui-sheets-title">Sheets</title>
<desc id="ui-sheets-description">
