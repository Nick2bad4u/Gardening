<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="ui-pin-title" aria-describedby="ui-pin-description" data-ui-icon="pin" focusable="false">
  <title id="ui-pin-title">Pin</title>
<desc id="ui-pin-description">
    A terracotta map pin has a round golden center and a clearly joined
