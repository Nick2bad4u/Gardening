---
name: "Test Apps Script Logger"

run-name: "Logger Tests: ${{ github.event_name }} on ${{ github.ref_name }}"

on:
    push:
        branches:
            - "main"
    pull_request:
    workflow_dispatch:

permissions:
    contents: "read"
    id-token: "write"

concurrency:
    group: "logger-coverage-${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

defaults:
    run:
        shell: "bash"

jobs:
    coverage:
        name: "Logger tests and coverage"
        runs-on: "ubuntu-latest"
        timeout-minutes: 15
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Set up Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: 26
                  cache: "npm"

            - name: "Install dependencies"
              run: "npm ci --ignore-scripts"

            - name: "Run logger tests with coverage"
              run: "npm run test:logger:coverage"

            - name: "Upload coverage artifact"
              if: "${{ !cancelled() }}"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "logger-coverage"
                  path: "coverage/"
                  if-no-files-found: "error"
                  retention-days: 7

            - name: "Upload coverage to Codecov"
              if: "${{ !cancelled() }}"
              uses: "codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f" # v7.0.0
              with:
                  disable_search: true
                  fail_ci_if_error: true
                  files: "coverage/lcov.info"
                  flags: "apps-script-server"
                  name: "apps-script-server"
                  report_type: "coverage"
                  use_oidc: true
