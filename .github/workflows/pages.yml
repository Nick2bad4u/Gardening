---
name: "Website Checks and Pages"

run-name: "Website Checks and Pages: ${{ github.ref_name }}"

on:
    pull_request:
    push:
        branches:
            - "main"
    workflow_dispatch:

permissions:
    contents: "read"

concurrency:
    group: "pages-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

defaults:
    run:
        shell: "bash"

jobs:
    build:
        name: "Test website and build Pages artifact"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        steps:
            - name: "Check out repository"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1

            - name: "Set up Node.js"
              uses: "actions/setup-node@820762786026740c76f36085b0efc47a31fe5020" # v7.0.0
              with:
                  node-version: 26
                  package-manager-cache: false

            - name: "Set up npm 12"
              working-directory: "${{ runner.temp }}"
              run: "npm install --global --ignore-scripts --no-audit --no-fund npm@12.0.2"

            - name: "Cache npm downloads"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "~/.npm"
                  key: "${{ runner.os }}-node26-npm12-${{ hashFiles('package-lock.json') }}"
                  restore-keys: "${{ runner.os }}-node26-npm12-"

            - name: "Install dependencies"
              run: "npm ci"

            - name: "Check types and maintained source"
              run: |
                  npm run typecheck
                  npm run typecheck:browser
                  npm run typecheck:build
                  npm run typecheck:tests
                  npm run lint
                  npm run lint:style

            - name: "Verify generated field guide"
              run: "npm run check:booklet"

            - name: "Install Chromium and system dependencies"
              run: "npx playwright install --with-deps chromium"

            - name: "Run Storybook browser tests with coverage"
              run: "npm run test:storybook:coverage"

            - name: "Upload Storybook coverage"
              if: "${{ !cancelled() }}"
              uses: "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a" # v7.0.1
              with:
                  name: "storybook-coverage"
                  path: "coverage/storybook"
                  retention-days: 7
                  if-no-files-found: "ignore"

            - name: "Cache collection thumbnails"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: ".cache/collection-previews-v1"
                  key: "collection-previews-v1-${{ hashFiles('assets/collection-photos/photo-manifest.json') }}"
                  restore-keys: "collection-previews-v1-"

            - name: "Build Pages site"
              run: "npm run build:pages"

            - name: "Check the static Storybook at its published subpath"
              run: "npm run test:storybook:static"

            - name: "Configure GitHub Pages"
              if: "${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}"
              uses: "actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d" # v6.0.0

            - name: "Upload Pages artifact"
              if: "${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}"
              uses: "actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9" # v5.0.0
              with:
                  path: ".pages-site"

    deploy:
        name: "Deploy GitHub Pages"
        if: "${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}"
        needs: "build"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        permissions:
            contents: "read"
            pages: "write"
            id-token: "write"
        environment:
            name: "github-pages"
            url: "${{ steps.deployment.outputs.page_url }}"
        steps:
            - name: "Deploy to GitHub Pages"
              id: "deployment"
              uses: "actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346" # v5.0.1
