[mcp_servers.playwright]
    enabled             = true
    startup_timeout_sec = 60
    tool_timeout_sec    = 60
    command             = "npx"
    args                = [ "-y", "@playwright/mcp" ]

[mcp_servers."storybook mcp addon"]
    enabled             = true
    startup_timeout_sec = 60
    tool_timeout_sec    = 60
    command             = "npx"
    args                = [ "-y", "@storybook/addon-mcp", "--port", "6006" ]
